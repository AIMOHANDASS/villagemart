name: Build Android APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build ${{ matrix.app-name }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - app-name: consumer-app
            vite-target: client
            apk-name: villagemart-client.apk
            app-id: com.villagemartapp.in
            manifest-type: customer
          - app-name: admin-app
            vite-target: admin
            apk-name: villagemart-admin.apk
            app-id: com.villagemart.app
            manifest-type: partner
          - app-name: delivery-app
            vite-target: delivery
            apk-name: villagemart-delivery.apk
            app-id: com.villagemart.deliverypartner
            manifest-type: partner
          - app-name: transport-app
            vite-target: transport
            apk-name: villagemart-transport.apk
            app-id: com.villagemart.transportpartner
            manifest-type: partner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Vite App (${{ matrix.vite-target }})
        working-directory: ./frontend
        run: npm run build:${{ matrix.vite-target }}

      - name: Backup Configuration Files
        working-directory: ./frontend
        run: |
          cp capacitor.config.ts capacitor.config.ts.bak
          cp android/app/build.gradle android/app/build.gradle.bak
          cp android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml.bak

      - name: Inject Target Configuration
        working-directory: ./frontend
        run: |
          # Dynamically update capacitor.config.ts and build.gradle for the matrix target
          sed -i "s|webDir: '.*'|webDir: 'dist/${{ matrix.vite-target }}'|g" capacitor.config.ts
          sed -i "s|appId: '.*'|appId: '${{ matrix.app-id }}'|g" capacitor.config.ts
          sed -i "s|applicationId \".*\"|applicationId \"${{ matrix.app-id }}\"|g" android/app/build.gradle
          # Apply the target-specific AndroidManifest
          cp android/manifests/AndroidManifest-${{ matrix.manifest-type }}.xml android/app/src/main/AndroidManifest.xml

      - name: Capacitor Native Sync
        working-directory: ./frontend
        run: npx cap sync android

      - name: Clean Old Default Launcher Icons
        working-directory: ./frontend/android/app/src/main/res
        run: |
          for density in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
            rm -f mipmap-${density}/ic_launcher.png
            rm -f mipmap-${density}/ic_launcher_round.png
            rm -f mipmap-${density}/ic_launcher_foreground.png
          done

      - name: Inject Custom Brand Assets
        run: |
          # Recursively copy all files from the vault into the Android res directory
          cp -a ./frontend/mobile-icons-vault/${{ matrix.app-name }}/. ./frontend/android/app/src/main/res/

      - name: Make Gradle Wrapper Executable
        working-directory: ./frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./frontend/android
        run: |
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Rename APK Artifact
        working-directory: ./frontend/android/app/build/outputs/apk/debug
        run: mv app-debug.apk ${{ matrix.apk-name }}

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.apk-name }}
          path: ./frontend/android/app/build/outputs/apk/debug/${{ matrix.apk-name }}
          retention-days: 7

      - name: Decode Android Keystore
        working-directory: ./frontend/android
        run: echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Build Release AAB
        working-directory: ./frontend/android
        env:
          ANDROID_UPLOAD_KEYSTORE_FILE: ${{ github.workspace }}/frontend/android/keystore.jks
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Rename AAB Artifact
        working-directory: ./frontend/android/app/build/outputs/bundle/release
        run: |
          apk_name="${{ matrix.apk-name }}"
          aab_name="${apk_name%.apk}.aab"
          mv app-release.aab "$aab_name"
          echo "AAB_NAME=$aab_name" >> $GITHUB_ENV

      - name: Upload AAB to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ env.AAB_NAME }}
          path: ./frontend/android/app/build/outputs/bundle/release/${{ env.AAB_NAME }}
          retention-days: 7

      - name: Restore Configuration Files & Cleanup
        if: always()
        working-directory: ./frontend
        run: |
          mv capacitor.config.ts.bak capacitor.config.ts || true
          mv android/app/build.gradle.bak android/app/build.gradle || true
          mv android/app/src/main/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml || true
          rm -f android/keystore.jks
